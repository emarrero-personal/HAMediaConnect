name: CI · Validate HACS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hacs.yml'
      - '.github/workflows/manual-release.yml'
      - 'hacs.json'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'custom_components/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS repository validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate repository for HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
