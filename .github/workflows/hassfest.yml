name: CI · Validate Hassfest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hassfest.yml'
      - '.github/workflows/manual-release.yml'
      - 'docs/**'
      - 'custom_components/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
