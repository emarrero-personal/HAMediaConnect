name: Release 1 · Tag approved commit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. v1.0.1'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Create immutable release tag after CI
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested release
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid v-prefixed release version (e.g. v1.0.1)."
            exit 1
          fi
          
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and verify release commit
        id: release-commit
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          release_sha="$GITHUB_SHA"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            release_sha="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA" || {
              echo "::error::Existing tag is not an ancestor of the selected main commit."
              exit 1
            }
            echo "Recovering existing immutable tag $VERSION at $release_sha"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify versions at release commit
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${VERSION#v}"
          android_version="$(git show "$RELEASE_SHA:app/build.gradle.kts" | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)"
          integration_version="$(git show "$RELEASE_SHA:custom_components/hamediaconnect/manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          [[ "$android_version" == "$expected" && "$integration_version" == "$expected" ]] || {
            echo "::error::Release $VERSION does not match Android ($android_version) and integration ($integration_version)."
            exit 1
          }

      - name: Require passing CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          workflows=(android-apk.yml validate-ha.yml hacs.yml hassfest.yml)
          for workflow in "${workflows[@]}"; do
            echo "Checking $workflow at $RELEASE_SHA"
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$RELEASE_SHA" -f per_page=100)"
            success="$(jq -r --arg sha "$RELEASE_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<< "$runs")"
            [[ "$success" -ge 1 ]] || {
              echo "::error::No successful push CI run for $workflow at release commit $RELEASE_SHA."
              exit 1
            }
          done

      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          
      - name: Check existing release state
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            existing_commit="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            [[ "$existing_commit" == "${{ steps.release-commit.outputs.sha }}" ]] || { echo "::error::Tag changed during release workflow"; exit 1; }
          fi

      - name: Create missing immutable tag
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Verified existing tag $VERSION; no changes."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "$VERSION" -m "HAMediaConnect $VERSION" "$GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "refs/tags/$VERSION"

      - name: Summarize release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Verified release tag $VERSION at commit ${{ steps.release-commit.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The distribution workflow builds, signs, and publishes the release with assets." >> "$GITHUB_STEP_SUMMARY"
