name: Tag and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. v1.0.1'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a prerelease'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Create immutable release tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested release
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ]]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid v-prefixed release version (e.g. v1.0.1)."
            exit 1
          fi
          
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release versions match requested tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${VERSION#v}"
          android_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          integration_version="$(python3 -c 'import json; print(json.load(open("custom_components/hamediaconnect/manifest.json"))["version"])')"
          if [[ "$android_version" != "$expected" || "$integration_version" != "$expected" ]]; then
            echo "::error::Requested $VERSION does not match Android ($android_version) and integration ($integration_version) versions."
            exit 1
          fi

      - name: Require passing CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # All four workflows must have completed successfully on this exact main commit.
          # A successful PR check or a check on an older commit is insufficient.
          workflows=(android-apk.yml validate-ha.yml hacs.yml hassfest.yml)
          for workflow in "${workflows[@]}"; do
            echo "Checking $workflow for $RELEASE_SHA"
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$RELEASE_SHA" -f branch=main -f per_page=100)"
            success="$(jq -r --arg sha "$RELEASE_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length' <<< "$runs")"
            if [[ "$success" -lt 1 ]]; then
              echo "::error::No successful main push run for $workflow at $RELEASE_SHA. Wait for CI or fix failures before tagging."
              exit 1
            fi
          done

      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          
      - name: Check existing release state
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            existing_commit="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            [[ "$existing_commit" == "$GITHUB_SHA" ]] || { echo "::error::Tag points to $existing_commit, not $GITHUB_SHA"; exit 1; }
          fi

      - name: Create missing tag and release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "HAMediaConnect $VERSION" --generate-notes --verify-tag)
          # Create the tag explicitly against the checked-out main SHA.
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "$VERSION" -m "HAMediaConnect $VERSION" "$GITHUB_SHA"
          # Persist the tag before creating the release. No force pushes.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "refs/tags/$VERSION"
          fi
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; leaving unchanged."
            exit 0
          fi
          gh release create "$VERSION" "${args[@]}"

      - name: Summarize release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Created release $VERSION at commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
