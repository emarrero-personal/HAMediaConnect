name: Validate Home Assistant integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate-ha.yml'
      - '.github/workflows/manual-release.yml'
  pull_request: {}

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run Python tests with coverage gate
        run: python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-integration-coverage
          path: coverage.xml
          if-no-files-found: warn
