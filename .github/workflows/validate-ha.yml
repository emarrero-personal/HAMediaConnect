name: Validate Home Assistant integration
on:
  push:
    branches: [feature/v0.2-oauth-media-player]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/workflows/validate-ha.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'tests/**'

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run isolated registry tests
        run: python -m pytest -q tests/test_registry.py
