name: Validate Home Assistant integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate-ha.yml'
      - '.github/workflows/manual-release.yml'
      - 'scripts/audit_runtime_dependencies.py'
  pull_request: {}
  schedule:
    - cron: '23 11 * * 1'

permissions:
  contents: read

jobs:
  python-checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run Python tests with coverage gate
        run: python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-integration-coverage
          path: coverage.xml
          if-no-files-found: warn

  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python test dependencies
        run: python -m pip_audit -r requirements-test.txt
