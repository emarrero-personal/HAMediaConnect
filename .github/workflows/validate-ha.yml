name: Validate Home Assistant integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate-ha.yml'
      - '.github/workflows/manual-release.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - '.github/workflows/validate-ha.yml'
      - '.github/workflows/manual-release.yml'

  schedule:
    - cron: '23 11 * * 1'

jobs:
  python-checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python modules
        run: python -m compileall -q custom_components tests
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run Python tests with coverage gate
        run: python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-integration-coverage
          path: coverage.xml
          if-no-files-found: warn

  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python test dependencies
        run: python -m pip_audit -r requirements-test.txt
