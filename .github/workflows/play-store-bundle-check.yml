name: "Android | Play Store bundle check"

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/play-store-bundle-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted Ubuntu runners include the Android SDK; avoid redundant SDK setup.
      - name: Build Android App Bundle (no publishing credentials)
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Inspect bundle output
        run: |
          find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print
          test -n "$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
