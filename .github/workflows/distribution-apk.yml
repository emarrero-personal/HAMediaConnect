name: Release 2 · Sign and publish APK

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable tag to build, sign, and publish (e.g. v1.0.6)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on protected main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT" || {
            echo "::error::Release tag does not point to a commit on main"
            exit 1
          }
          echo "Verified $RELEASE_TAG at $TAG_COMMIT is on main ($MAIN_COMMIT)"
      - name: Verify Android and integration versions match release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          ACTUAL_VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          INTEGRATION_VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/hamediaconnect/manifest.json"))["version"])')"
          [[ -n "$ACTUAL_VERSION" && "$ACTUAL_VERSION" == "$EXPECTED_VERSION" && "$INTEGRATION_VERSION" == "$EXPECTED_VERSION" && "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Tag $RELEASE_TAG must match Android versionName ($ACTUAL_VERSION) and integration version ($INTEGRATION_VERSION), with a valid versionCode ($VERSION_CODE)"
            exit 1
          }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run Home Assistant integration tests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-fail-under=85
      - name: Run Android unit tests and coverage gate
        run: bash ./gradlew --no-daemon testDebugUnitTest appCodeCoverageReport verifyAppCodeCoverage securityCodeCoverageReport verifySecurityCodeCoverage
      - name: Capture resolved release runtime dependency inventory
        run: |
          mkdir -p build/release-compliance
          bash ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > build/release-compliance/releaseRuntimeClasspath.txt
          test -s build/release-compliance/releaseRuntimeClasspath.txt
          if grep -E '(^|[[:space:]])FAILED([[:space:]]|$)' build/release-compliance/releaseRuntimeClasspath.txt; then
            echo "::error::Unresolved release runtime dependency"
            exit 1
          fi
      - name: Archive release dependency inventory
        uses: actions/upload-artifact@v7
        with:
          name: release-runtime-dependencies-${{ inputs.release_tag || github.ref_name }}
          path: build/release-compliance/releaseRuntimeClasspath.txt
          if-no-files-found: error


  publish:
    name: Sign and publish approved release
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production-signing
    permissions:
      contents: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate release tag against main
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" refs/remotes/origin/main
      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Published releases are immutable; use a new version."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure the four production-signing environment secrets."
            exit 1
          }
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hamediaconnect-release.jks"
          chmod 600 "$RUNNER_TEMP/hamediaconnect-release.jks"
      - name: Build signed release APK
        env:
          HAMEDIACONNECT_KEYSTORE_PATH: ${{ runner.temp }}/hamediaconnect-release.jks
          HAMEDIACONNECT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          HAMEDIACONNECT_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          HAMEDIACONNECT_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify signature and stage distribution
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" HAMediaConnect.apk
          sha256sum HAMediaConnect.apk > HAMediaConnect.apk.sha256
      - name: Publish signed assets with the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG appeared during build; refusing to modify it."
            exit 1
          fi
          # gh release create stages uploaded assets before publishing the release.
          # Never publish an empty immutable release and try to upload later.
          gh release create "$RELEASE_TAG" HAMediaConnect.apk HAMediaConnect.apk.sha256 \
            --title "HAMediaConnect $RELEASE_TAG" \
            --generate-notes \
            --verify-tag
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hamediaconnect-release.jks"
