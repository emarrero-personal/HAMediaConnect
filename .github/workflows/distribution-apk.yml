name: Publish signed distribution APK

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Home Assistant integration tests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-fail-under=85
      - name: Run Android unit tests and coverage gate
        run: bash ./gradlew --no-daemon testDebugUnitTest appCodeCoverageReport verifyAppCodeCoverage
      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure the four Android release signing secrets before publishing."
            exit 1
          }
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hamediaconnect-release.jks"
          chmod 600 "$RUNNER_TEMP/hamediaconnect-release.jks"
      - name: Build signed release APK
        env:
          HAMEDIACONNECT_KEYSTORE_PATH: ${{ runner.temp }}/hamediaconnect-release.jks
          HAMEDIACONNECT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          HAMEDIACONNECT_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          HAMEDIACONNECT_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify signature and stage distribution
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" HAMediaConnect.apk
          sha256sum HAMediaConnect.apk > HAMediaConnect.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" HAMediaConnect.apk HAMediaConnect.apk.sha256 \
            --title "HAMediaConnect $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hamediaconnect-release.jks"
