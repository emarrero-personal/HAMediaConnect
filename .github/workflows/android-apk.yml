name: Build HAMediaConnect APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'branding/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
      - 'README.md'
      - 'docs/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'app/**'
      - 'branding/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
      - 'README.md'
      - 'docs/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: hamediaconnect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "Android SDK command-line tools missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 | grep -E "platforms;android-37|build-tools;36" || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run Python integration unit tests with 85% coverage gate
        run: python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=85
      - name: Upload Python coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
      - name: Run unit tests and enforce 85% coverage
        run: bash ./gradlew --no-daemon testDebugUnitTest appCodeCoverageReport verifyAppCodeCoverage securityCodeCoverageReport verifySecurityCodeCoverage
      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/appCodeCoverageReport/
            app/build/reports/jacoco/appCodeCoverageReport/appCodeCoverageReport.xml
            app/build/reports/jacoco/securityCodeCoverageReport/
          if-no-files-found: warn
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HAMediaConnect-v1.0.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-v1.0.4-debug
          path: HAMediaConnect-v1.0.4-debug.apk
          if-no-files-found: error
          retention-days: 30

  security-device-tests:
    name: Keystore and service instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install emulator and SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Run security instrumentation on a disposable emulator
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager -print -quit)"
          printf 'no\n' | "$AVDMANAGER" create avd --name security-tests --package "system-images;android-35;google_apis;x86_64" --device pixel_2 --force
          "$ANDROID_HOME/emulator/emulator" -avd security-tests -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/security-emulator.log" 2>&1 &
          trap 'adb -s emulator-5554 emu kill || true' EXIT
          if ! timeout 180 bash -c 'until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 2; done'; then
            cat "$RUNNER_TEMP/security-emulator.log"
            exit 1
          fi
          adb -s emulator-5554 shell input keyevent 82
          bash ./gradlew --no-daemon connectedDebugAndroidTest securityDeviceCoverageReport
      - name: Upload instrumentation results and device coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-security-device-tests
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/jacoco/securityDeviceCoverageReport/
            ${{ runner.temp }}/security-emulator.log
          if-no-files-found: warn
