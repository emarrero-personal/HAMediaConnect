name: Build HAMediaConnect APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
      - 'custom_components/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: hamediaconnect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "Android SDK command-line tools missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --list --channel=3 | grep -E "platforms;android-37|build-tools;36" || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run Python integration unit tests with 85% coverage gate
        run: python -m pytest tests/ --cov=custom_components/hamediaconnect --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=85
      - name: Upload Python coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-python-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
      - name: Run unit tests and enforce 85% coverage
        run: bash ./gradlew --no-daemon testDebugUnitTest appCodeCoverageReport verifyAppCodeCoverage
      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/appCodeCoverageReport/
            app/build/reports/jacoco/appCodeCoverageReport/appCodeCoverageReport.xml
          if-no-files-found: warn
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HAMediaConnect-v0.9.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HAMediaConnect-v0.9.0-debug
          path: HAMediaConnect-v0.9.0-debug.apk
          if-no-files-found: error
          retention-days: 30
